[project]
name = "artifice-suite"
version = "0.1.0"
description = "Local-first, BYOM desktop tool suite designed around harness architecture."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
ocr = ["artifice-ocr", "artifice-model-harness>=0.1.0", "artifice-shared-ui>=0.1.0"]
ocr-web = ["artifice-ocr[web]", "artifice-model-harness>=0.1.0", "artifice-shared-ui>=0.1.0"]
draft = ["artifice-draft", "artifice-model-harness>=0.1.0", "artifice-shared-ui>=0.1.0"]
graph = ["artifice-graph", "artifice-model-harness>=0.1.0", "artifice-shared-ui>=0.1.0"]
transcribe = ["artifice-transcribe", "artifice-model-harness>=0.1.0", "artifice-shared-ui>=0.1.0"]
all = [
    "artifice-ocr",
    # web extra included so that --extra all carries the packages
    # draft's test suite needs (readability-lxml, fastapi, uvicorn).
    # The per-app extras for the other three apps are not needed for
    # testing at the time of writing.
    "artifice-draft[web]",
    "artifice-graph",
    "artifice-transcribe",
    "artifice-model-harness>=0.1.0",
    "artifice-shared-ui>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This root package ships no code of its own — it only exists so the "all"
# extra and the uv workspace below have somewhere to be declared.
py-modules = []

# These extras name workspace-only packages that are not published anywhere
# (no PyPI, no private index). Plain `pip install "artifice-suite[ocr]"`
# CANNOT resolve them — pip has no way to find an unpublished local sibling
# package from a bare dependency name, and PEP 508 has no portable syntax for
# "the sibling directory of wherever this repo happens to be cloned". This
# is exactly what a uv workspace is for: `[tool.uv.sources]` below maps each
# name to its workspace member, so uv resolves and installs all of them
# (each editable) in one step. Install with:
#   uv sync --extra ocr        # or draft / graph / transcribe / all
#   uv pip install -e ".[ocr]" # uv's pip-compatible interface also works
# Plain `pip` (not `uv pip`) only works for a single app installed directly:
#   pip install -e apps/artifice-ocr
[tool.uv.workspace]
members = ["apps/*", "packages/model-harness", "packages/secure-io", "packages/shared-ui"]

[tool.uv.sources]
artifice-ocr = { workspace = true }
artifice-draft = { workspace = true }
artifice-graph = { workspace = true }
artifice-transcribe = { workspace = true }
artifice-model-harness = { workspace = true }
artifice-secure-io = { workspace = true }
artifice-shared-ui = { workspace = true }

[tool.uv]
override-dependencies = [
    # whisperx declares an unconditional triton dependency, which the
    # maintainer has excluded because triton adds ~1.5 GB to the install
    # and is not needed on this machine.  An always-false python_version
    # marker ("< '0'") is the uv-native mechanism for suppressing a
    # transitive dependency without forking — the resolver honours it,
    # the marker never matches any real interpreter, and the override
    # stays declarative rather than requiring a post-resolve script.
    { package = { name = "whisperx" }, dependencies = ["triton>=3.3.0; python_version < '0'"] },
]

[dependency-groups]
dev = [
    "fonttools[woff]>=4.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # pytest-httpx is needed by packages/model-harness/tests but must be
    # declared here because `uv sync --group dev` installs the *root's*
    # dev group, not any member package's.  The member-level dev group
    # in packages/model-harness/pyproject.toml is intentionally empty
    # (see that file's comment for why).
    "pytest-httpx>=0.36.2",
    "httpx>=0.27.0",
    "pillow>=10.0",
    "ruff>=0.5.0",
]

# No CI job enforces ruff yet — a lint gate is a Phase 5 item.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
