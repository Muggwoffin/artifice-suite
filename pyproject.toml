[project]
name = "ocr_pipeline"
version = "0.1.0"
description = "A pipeline for historical document OCR and translation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "ollama",
    "openai",
    "python-dotenv",
    "pyyaml",
    "PyMuPDF",
    "tkinterdnd2",
]

[project.scripts]
ocr_pipeline = "ocr_pipeline.cli:app"
ocr_pipeline_gui = "ocr_pipeline.gui:main"
