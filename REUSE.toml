# ── Repository dotfiles ────────────────────────────────────────────────────────
# Per-app .gitignore / .gitattributes. Comment syntax exists, but a licence
# header on a three-line ignore file is noise; declared instead.

[[annotations]]
path = ["**/.gitignore", "**/.gitattributes"]
SPDX-FileCopyrightText = "2026 Maurice Casey"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# ── Test fixtures and binary assets ────────────────────────────────────────────
# First-party fixtures with no comment syntax. The .jpg is a scanned public
# document used as an OCR fixture; the .docx exercises bold-run parsing.

[[annotations]]
path = [
    "apps/artifice-ocr/tests/fixtures/**",
    "apps/artifice-draft/test_bold.docx",
    "design-system/.thumbnail",
]
SPDX-FileCopyrightText = "2026 Maurice Casey"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# ── Windows shortcuts ──────────────────────────────────────────────────────────
# Binary .lnk files. NOTE: these are machine-local build artefacts and arguably
# should not be tracked at all — .gitattributes already calls them
# "machine-local artifacts". Declared here so `reuse lint` is green; removing
# them from the index is a separate decision for the maintainer.

[[annotations]]
path = "apps/artifice-ocr/*.lnk"
SPDX-FileCopyrightText = "2026 Maurice Casey"
SPDX-License-Identifier = "AGPL-3.0-or-later"
