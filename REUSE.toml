version = 1

# =============================================================================
# Artifice Suite — REUSE.toml
# =============================================================================
# Bulk licence declarations for file types whose format makes inline SPDX
# headers impractical (JSON has no comment syntax) or undesirable (markdown
# documents, binary assets).  Real SPDX headers live in source files (*.py,
# *.css, *.js, *.html, *.sh, *.ps1, *.jsx, *.ts).
#
# Annotations are evaluated in order; later entries override earlier ones for
# files that match both patterns.
# =============================================================================

# ── First-party AGPL-3.0-or-later: Markdown documents ────────────────────────

[[annotations]]
path = "**.md"
SPDX-FileCopyrightText = "2026 Maurice Casey"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# ── First-party AGPL-3.0-or-later: JSON (no comment syntax) ──────────────────

[[annotations]]
path = "**.json"
SPDX-FileCopyrightText = "2026 Maurice Casey"
SPDX-License-Identifier = "AGPL-3.0-or-later"

