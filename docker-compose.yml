services:
  artifice-ocr:
    build:
      context: .
      dockerfile: apps/artifice-ocr/Dockerfile
    ports:
      - "3001:8000"
    environment:
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/artifice-ocr:/app/apps/artifice-ocr

  artifice-draft:
    build:
      context: .
      dockerfile: apps/artifice-draft/Dockerfile
    ports:
      - "3002:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/artifice-draft:/app/apps/artifice-draft

  artifice-graph:
    build:
      context: .
      dockerfile: apps/artifice-graph/Dockerfile
    ports:
      - "3003:8766"
    environment:
      - CALLOSIP_HOST=0.0.0.0
      - CALLOSIP_PORT=8766
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - EMBEDDING_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/artifice-graph:/app/apps/artifice-graph

  artifice-transcribe:
    build:
      context: .
      dockerfile: apps/artifice-transcribe/Dockerfile
    ports:
      - "3004:8000"
    environment:
      - CALLOSIP_HOST=0.0.0.0
      - CALLOSIP_PORT=8000
      - WHISPER_MODEL=base
      - DIARIZATION_PROVIDER=pyannote
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/artifice-transcribe:/app/apps/artifice-transcribe
