name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Static gates ──────────────────────────────────────────────────────────
  # Every gate here exits non-zero on failure.  If any of these are red the
  # rest of the pipeline is a waste of time, so they run first and the test
  # and wheel jobs depend on them.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        # SC2012 is a pre-existing INFO in smoke-test-agents.sh (ls vs find).
        # Excluded so the gate reports genuine problems rather than a permanent
        # red for a style nit.
        run: shellcheck --exclude=SC2012 scripts/*.sh

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks detect (Zero Secrets Policy)
        run: gitleaks detect --redact --no-banner

      - name: Install reuse
        run: pipx install reuse

      - name: REUSE compliance (every file's licence is machine-determinable)
        # Exits non-zero when any file lacks copyright/licence information.
        # Source files carry real SPDX headers; dotfiles, binaries and markdown
        # are declared in REUSE.toml.  Third-party material — the vendored
        # Leaflet bundle (BSD-2-Clause) and three font families (OFL-1.1) — is
        # declared with its real upstream licence, NOT stamped AGPL-3.0-or-later.
        run: reuse lint

      - name: Token parity check
        run: python3 scripts/token-parity-check.py

      - name: Audit controls
        run: python3 scripts/audit-controls.py

      # -------------------------------------------------------------------
      # DO NOT add smoke-test-agents.sh here.  It dispatches live model
      # calls to paid provider accounts and would burn credits on every
      # push.  It belongs in a pre-release manual checklist, not CI.
      # -------------------------------------------------------------------

  # ── Lint & audit gates ───────────────────────────────────────────────────
  # Ruff is enforced against a COMMITTED BASELINE, not a clean tree: the repo
  # carries a pre-existing ruff backlog (~318 (file|code) pairs when the
  # baseline was generated), so a hard `ruff check` gate would be permanently
  # red and teach contributors to ignore it.  The baseline gate fails only on
  # NEW or INCREASED violations; shrinking the backlog is always allowed.
  # Refresh it deliberately: `uv run python scripts/check-ruff-baseline.py
  # --generate` in the same commit that cleans code up.
  lint:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The format gate below diffs against the PR's base commit.
          # actions/checkout defaults to a shallow clone (fetch-depth: 1), which
          # fetches the merge commit and nothing else, so `git diff $BASE_SHA`
          # dies with `fatal: bad object` and exit 128 — a gate failure that
          # looks identical to a formatting failure but fires on every PR
          # regardless of content.  Full history is what makes the base
          # reachable.  (This never showed up before because the ruff and
          # dependency-audit steps above it were failing first, so the format
          # gate had never actually run on any PR.)
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install workspace root dependencies (incl. ruff)
        run: uv sync --group dev --extra all
        working-directory: .

      - name: ruff baseline gate (no NEW violations)
        run: uv run python scripts/check-ruff-baseline.py

      - name: Dependency audit (no ghost or undeclared imports)
        # Supply-chain gate for generated code: fails on imports of packages
        # that do not exist, are not declared, or are not in uv.lock, and on
        # declared deps the lockfile does not resolve.
        run: uv run python scripts/check-dependency-audit.py

      - name: ruff format check (changed files, PRs only)
        # `pull_request.base.sha` is empty on push, so this is a PR-only gate.
        # It checks only the files the PR touched — pre-existing formatting
        # debt elsewhere in the tree is not this PR's concern.  When a file is
        # touched, format the WHOLE file, not just the diff hunk.
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "Format gate runs on pull_request only; skipping on push."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- '*.py')
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files; format gate passes."
            exit 0
          fi
          echo "Checking format of changed files:"
          echo "$CHANGED"
          # shellcheck disable=SC2086  # intended word-splitting over file list
          uv run ruff format --check $CHANGED

      - name: pip-audit (known vulnerabilities in pinned deps)
        # Queries the OSV API.  If a pinned dep has a known vuln that cannot be
        # resolved by a small bump inside the change at hand, add an
        # --ignore-vulns entry WITH a comment explaining why — do not bump
        # dependencies casually, and do not disable the gate.
        run: |
          # torch 2.8.0 — CVEs fixed in torch>=2.9.0/2.10.0/2.13.0.  Bumping torch
          # is a whisperx/pyannote ecosystem change, not a one-line fix; tracked
          # as a separate dependency-upgrade task.
          # transformers 4.57.6 — CVEs fixed in transformers>=5.0.0.  The 4→5 major
          # bump is a breaking change for the whisperx integration; tracked as a
          # separate dependency-upgrade task alongside the torch bump above.
          uv run --with pip-audit pip-audit \
            --ignore-vuln PYSEC-2025-206 \
            --ignore-vuln PYSEC-2025-204 \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln PYSEC-2025-203 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2026-2286 \
            --ignore-vuln CVE-2025-2999 \
            --ignore-vuln CVE-2025-3001 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289

      - name: Dependency licence gate (no NEW proprietary/unknown licences)
        # Fails on any licence that is proprietary, commercial, or lacks
        # metadata UNLESS the package is in the known, deliberate set below.
        # The known set is a finding, not a pass: nvidia-* are the CUDA wheels
        # that torch pulls in (their binaries are NVIDIA's proprietary software
        # — unavoidable while transcribe depends on torch's CUDA wheels, and
        # recorded as a maintainer finding rather than silently accepted);
        # pyannote-* and torchcodec are MIT/BSD but publish no machine-readable
        # licence metadata, so pip-licenses reports UNKNOWN (a metadata gap, not
        # a proprietary dependency).  Anything NEW in the proprietary/unknown
        # bucket fails the gate.
        run: |
          uv run --with pip-licenses pip-licenses --format=json > /tmp/licenses.json
          python3 - <<'EOF'
          import json, sys
          from collections import Counter
          with open('/tmp/licenses.json') as f:
              packages = json.load(f)
          EXEMPT_PREFIXES = ('nvidia-', 'pyannote', 'pyannoteai')
          # pymupdf is dual-licensed AGPL-3.0-or-later OR Artifex Commercial;
          # the AGPL branch is compatible with this project's own AGPL licence,
          # so the "commercial" token in its string is a false positive.
          EXEMPT_NAMES = {'torchcodec', 'pymupdf'}
          bad = []
          for p in packages:
              name = p.get('Name', '')
              lic = (p.get('License') or '').lower()
              flagged = 'proprietary' in lic or 'commercial' in lic or lic in ('', 'unknown')
              if not flagged:
                  continue
              if name.startswith(EXEMPT_PREFIXES) or name in EXEMPT_NAMES:
                  continue
              bad.append((name, p.get('License')))
          freq = Counter((p.get('License') or 'UNKNOWN') for p in packages)
          print(f'Packages checked: {len(packages)}')
          for name, count in freq.most_common():
              print(f'  {name}: {count}')
          if bad:
              print('NEW proprietary/unknown licences found:')
              for name, lic in bad:
                  print(f'  {name}: {lic}')
              sys.exit(1)
          print('Licence gate passed.')
          EOF

  # ── Tests ─────────────────────────────────────────────────────────────────
  tests:
    needs: gates
    runs-on: ubuntu-latest
    strategy:
      # One app's failure must not cancel the other three.  With the default
      # fail-fast, a single red suite hid every other result and each CI round
      # reported one problem instead of all of them.
      fail-fast: false
      matrix:
        include:
          # artifice-ocr: 487 passed, 1 skipped — clean baseline (2026-08-05).
          # No extra dependencies needed beyond the workspace root.
          - app: artifice-ocr
            extra-args: ""

          # artifice-draft: 225 passed (2026-08-05).
          # The root `all` extra declares `artifice-draft[web]`, which pulls
          # in readability-lxml, fastapi, uvicorn, etc. — everything the
          # test suite needs.  No separate per-app install step is required.
          - app: artifice-draft
            extra-args: ""

          # artifice-graph: 96 passed — clean baseline (2026-07-30).  No extras needed.
          - app: artifice-graph
            extra-args: ""

          # artifice-transcribe: 111 passed (2026-08-05).
          # tests/test_api.py is excluded permanently via
          # apps/artifice-transcribe/tests/conftest.py:20 (collect_ignore).
          # It is a standalone live-server script expecting 127.0.0.1:8000 and
          # an audio path in sys.argv[1]; headless coverage lives in
          # test_api_e2e.py.  The --ignore flag below is redundant with conftest
          # and is retained only so the intent is visible in the matrix entry.
          - app: artifice-transcribe
            extra-args: "--ignore=tests/test_api.py"

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install workspace root dependencies (incl. pytest)
        run: uv sync --group dev --extra all
        working-directory: .

      - name: Run tests
        run: uv run pytest -q ${{ matrix.extra-args }}

  # ── Wheel-content assertions ──────────────────────────────────────────────
  # Tests run against `src/` and cannot see bugs that only exist in the built
  # artifact: missing font files, prompt templates that resolve outside their
  # package and ship in no wheel, or a stale build/ resurrecting deleted code.
  wheel:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build artifact wheel
        run: bash scripts/build-wheel.sh artifice-ocr

      - name: Assert wheel contents
        run: |
          python3 -c "
          import zipfile, sys, glob

          whl_files = glob.glob('apps/artifice-ocr/dist/*.whl')
          assert len(whl_files) == 1, f'Expected exactly one .whl, found {len(whl_files)}'
          whl_path = whl_files[0]

          with zipfile.ZipFile(whl_path) as z:
              names = z.namelist()

              # ── Fonts: all four .ttf files must be present ──────────
              font_entries = [n for n in names if n.endswith('.ttf')]
              assert len(font_entries) == 4, \
                  f'Expected 4 TTF fonts in wheel, found {len(font_entries)}: {font_entries}'
              for expected in ('LibreBaskerville.ttf', 'LibreBaskerville-Italic.ttf',
                               'PlayfairDisplay.ttf', 'PlayfairDisplay-Italic.ttf'):
                  assert any(expected in f for f in font_entries), \
                      f'Missing font: {expected}'

              # ── Prompts: all three .txt files must be present ───────
              prompt_entries = [n for n in names
                                if 'prompts/' in n and n.endswith('.txt')]
              assert len(prompt_entries) == 3, \
                  f'Expected 3 prompt files in wheel, found {len(prompt_entries)}: {prompt_entries}'
              for expected in ('cleanup_prompt.txt', 'structure_prompt.txt',
                               'translation_prompt.txt'):
                  assert any(expected in p for p in prompt_entries), \
                      f'Missing prompt: {expected}'

              # ── gui/ must be absent (deleted in 5b01338) ────────────
              gui_entries = [n for n in names if '/gui/' in n]
              assert len(gui_entries) == 0, \
                  f'STALE BUILD: {len(gui_entries)} gui/ entries found in wheel. ' \
                  f'build/ was not cleaned before build. Entries: {gui_entries}'

              print(f'All wheel-content assertions passed ({len(names)} entries).')
          "

      - name: Assert wheel METADATA declares AGPL-3.0-or-later licence
        run: |
          python3 -c "
          import zipfile, glob

          whl_files = glob.glob('apps/artifice-ocr/dist/*.whl')
          assert len(whl_files) == 1, f'Expected exactly one .whl, found {len(whl_files)}'
          whl_path = whl_files[0]

          with zipfile.ZipFile(whl_path) as z:
              meta_entries = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
              assert len(meta_entries) == 1, \
                  f'Expected exactly one METADATA, found {meta_entries}'
              meta = z.read(meta_entries[0]).decode('utf-8')
              lic_lines = [l for l in meta.split('\n')
                           if l.lower().startswith('license-expression:')]
              assert lic_lines, 'No License field found in wheel METADATA'
              assert any('AGPL-3.0-or-later' in l for l in lic_lines), \
                  f'License field does not declare AGPL-3.0-or-later: {lic_lines}'
              print(f'METADATA licence field: {lic_lines[0].strip()}')
          "

      - name: Assert every .ttf font has accompanying licence text
        run: |
          python3 -c "
          import zipfile, glob, os

          whl_files = glob.glob('apps/artifice-ocr/dist/*.whl')
          whl_path = whl_files[0]

          with zipfile.ZipFile(whl_path) as z:
              names = z.namelist()
              ttf_entries = [n for n in names if n.endswith('.ttf')]
              for font_path in ttf_entries:
                  font_dir = os.path.dirname(font_path)
                  font_base = os.path.splitext(os.path.basename(font_path))[0]
                  # Derive the family name: strip -Italic / -Regular suffix
                  family = font_base.replace('-Italic', '').replace('-Regular', '')
                  expected_txt = f'{font_dir}/OFL-{family}.txt'
                  txt_in_dir = [
                      n for n in names
                      if n.startswith(font_dir + '/') and n.endswith('.txt')
                  ]
                  assert expected_txt in txt_in_dir, (
                      f'Font {font_path}: no accompanying licence text; '
                      f'expected {expected_txt}, found .txt: {txt_in_dir}'
                  )
                  print(f'  {font_path}  ->  {expected_txt}  (present)')

          print(f'Font-licence assertions passed for all {len(ttf_entries)} font(s).')
           "

      # ── artifice-ocr wheel: Jinja templates must be present ─────────
      - name: Assert artifice-ocr wheel contains web/templates/
        run: |
          python3 -c "
          import zipfile, glob

          whl_files = glob.glob('apps/artifice-ocr/dist/*.whl')
          assert len(whl_files) == 1, f'Expected exactly one .whl, found {len(whl_files)}'
          whl_path = whl_files[0]

          with zipfile.ZipFile(whl_path) as z:
              names = z.namelist()

              # web/templates/ must include the Jinja template tree
              template_entries = [n for n in names if 'web/templates/' in n and n.endswith('.html')]
              assert len(template_entries) >= 3, \
                  f'Expected >=3 templates in ocr wheel, found {len(template_entries)}: {template_entries}'
              for expected in ('base.html', 'index.html', 'about.html'):
                  assert any(expected in t for t in template_entries), \
                      f'Missing template: {expected}'

              # The stale index.html at web/static/ must be absent
              static_html = [n for n in names if n.endswith('web/static/index.html')]
              assert len(static_html) == 0, \
                  f'STALE ARTIFACT: web/static/index.html found in ocr wheel. ' \
                  f'Delete the file and rebuild.'

              print(f'Artifice-ocr wheel assertions passed ({len(names)} entries).')
          "

      # ── artifice-shared-ui wheel: masthead partial and templates ─────
      - name: Build artifice-shared-ui wheel
        run: |
          rm -rf packages/shared-ui/build packages/shared-ui/dist
          uv run --with build python -m build --wheel
        working-directory: packages/shared-ui

      - name: Assert artifice-shared-ui wheel contains templates/
        run: |
          python3 -c "
          import zipfile, glob

          whl_files = glob.glob('packages/shared-ui/dist/*.whl')
          assert len(whl_files) == 1, f'Expected exactly one .whl, found {len(whl_files)}'
          whl_path = whl_files[0]

          with zipfile.ZipFile(whl_path) as z:
              names = z.namelist()

              # shared_ui/templates/ must include the masthead partial
              template_entries = [n for n in names if 'templates/' in n and n.endswith('.html')]
              assert len(template_entries) >= 1, \
                  f'Expected >=1 template in artifice-shared-ui wheel, found {len(template_entries)}: {template_entries}'
              assert any('_masthead.html' in t for t in template_entries), \
                  f'_masthead.html missing from artifice-shared-ui wheel. Templates: {template_entries}'

              # shared_ui/assets/ must include masthead.css
              asset_entries = [n for n in names if 'assets/' in n]
              assert any('masthead.css' in a for a in asset_entries), \
                  f'masthead.css missing from artifice-shared-ui wheel. Assets: {asset_entries}'

              print(f'artifice-shared-ui wheel assertions passed ({len(names)} entries).')
          "

      # ── artifice-draft wheel: Jinja templates must be present ──────
      - name: Build artifice-draft wheel
        run: bash scripts/build-wheel.sh artifice-draft

      - name: Assert artifice-draft wheel contains web/templates/
        run: |
          python3 -c "
          import zipfile, glob

          whl_files = glob.glob('apps/artifice-draft/dist/*.whl')
          assert len(whl_files) == 1, f'Expected exactly one .whl, found {len(whl_files)}'
          whl_path = whl_files[0]

          with zipfile.ZipFile(whl_path) as z:
              names = z.namelist()

              # web/templates/ must include the Jinja template tree
              template_entries = [n for n in names if 'web/templates/' in n and n.endswith('.html')]
              assert len(template_entries) >= 3, \
                  f'Expected >=3 templates in draft wheel, found {len(template_entries)}: {template_entries}'
              for expected in ('base.html', 'index.html', 'about.html'):
                  assert any(expected in t for t in template_entries), \
                      f'Missing template: {expected}'

              # The stale index.html at web/static/ must be absent
              static_html = [n for n in names if n.endswith('web/static/index.html')]
              assert len(static_html) == 0, \
                  f'STALE ARTIFACT: web/static/index.html found in draft wheel. ' \
                  f'Delete the file and rebuild.'

              print(f'Artifice-draft wheel assertions passed ({len(names)} entries).')
          "

      # ── artifice-transcribe wheel: Jinja templates must be present ─
      - name: Build artifice-transcribe wheel
        run: bash scripts/build-wheel.sh artifice-transcribe

      - name: Assert artifice-transcribe wheel contains web/templates/
        run: |
          python3 -c "
          import zipfile, glob

          whl_files = glob.glob('apps/artifice-transcribe/dist/*.whl')
          assert len(whl_files) == 1, f'Expected exactly one .whl, found {len(whl_files)}'
          whl_path = whl_files[0]

          with zipfile.ZipFile(whl_path) as z:
              names = z.namelist()

              # web/templates/ must include the Jinja template tree
              template_entries = [n for n in names if 'web/templates/' in n and n.endswith('.html')]
              assert len(template_entries) >= 3, \
                  f'Expected >=3 templates in transcribe wheel, found {len(template_entries)}: {template_entries}'
              for expected in ('base.html', 'index.html', 'about.html'):
                  assert any(expected in t for t in template_entries), \
                      f'Missing template: {expected}'

              # The stale index.html at web/static/ must be absent
              static_html = [n for n in names if n.endswith('web/static/index.html')]
              assert len(static_html) == 0, \
                  f'STALE ARTIFACT: web/static/index.html found in transcribe wheel. ' \
                  f'Delete the file and rebuild.'

              print(f'Artifice-transcribe wheel assertions passed ({len(names)} entries).')
          "

  # ── Multi-platform smoke test ─────────────────────────────────────────────
  # All four apps × three platforms.  Previously this job covered only
  # artifice-ocr, so artifice-draft, artifice-graph and
  # artifice-transcribe had never been exercised on Windows or macOS in CI.
  #
  # transcribe pulls large ML dependencies (whisperx, torch, pyannote) and
  # its suite takes ~35 s locally.  If a hosted runner cannot install its
  # deps on a particular platform, that combination should be excluded
  # explicitly in the matrix below with a comment explaining why — do not
  # drop the app entirely or let it fail silently.
  tests-cross-platform:
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      # The whole point of this job is comparing platforms.  Cancelling the
      # other combinations the moment one fails destroys exactly the signal
      # it exists to produce.  fail-fast: false is *more* important now that
      # there are 12 combinations instead of 3.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        app: [artifice-ocr, artifice-draft, artifice-graph, artifice-transcribe]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install workspace root dependencies
        run: uv sync --group dev --extra all
        working-directory: .

      - name: Run tests (${{ matrix.app }})
        run: uv run pytest -q
