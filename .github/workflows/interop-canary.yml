name: Tropy interoperability canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      channel:
        description: Pinned Tropy lane to test
        required: true
        default: canary
        type: choice
        options:
          - canary
          - stable

permissions:
  contents: read

concurrency:
  group: tropy-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TROPY_CHANNEL: ${{ inputs.channel || 'canary' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 dbus-x11

      - name: Install Artifice test dependencies
        run: uv sync --group dev --extra all

      - name: Build pinned Tropy
        run: bash scripts/interop/bootstrap-tropy.sh "$TROPY_CHANNEL"

      - name: Run real Tropy contract
        run: bash scripts/interop/run-live-tropy.sh "$TROPY_CHANNEL"

      - name: Upload Tropy failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tropy-interop-${{ env.TROPY_CHANNEL }}-logs
          path: |
            /tmp/pytest-of-runner/**/runtime/process.log
            /tmp/pytest-of-runner/**/runtime/logs/tropy.log
          if-no-files-found: ignore
