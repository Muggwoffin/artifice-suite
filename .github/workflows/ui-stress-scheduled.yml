name: OCR UI stress (scheduled)

on:
  schedule:
    - cron: "17 3 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev --extra ocr-web
      - run: uv run playwright install --with-deps chromium
      - name: Run 50 seeds with 75 actions each
        run: scripts/stress/run-ui-stress.sh --scheduled
      - name: Upload replay artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scheduled-ocr-ui-stress-artifacts
          path: .artifacts/ui-stress
          if-no-files-found: ignore
