name: Build standalone executables

# WHY THIS WORKFLOW EXISTS
#
# PyInstaller cannot cross-compile. A Windows .exe must be built on Windows, a
# macOS binary on macOS. The maintainer's machine is Windows with WSL, and uv is
# deliberately NOT installed on the Windows side — so the only reproducible way
# to produce a Windows build is a Windows runner.
#
# The build is proven on Linux locally (249 MB onedir, serves HTTP 200 and
# resolves shared-ui assets through importlib.resources from inside the bundle).
# This workflow does the same on the platforms the maintainer ships to.
#
# macOS is deliberately ABSENT. A macOS binary cannot be opened by an ordinary
# user without notarisation — they would have to run
# `xattr -r -d com.apple.quarantine` by hand. Producing an unsigned .app that
# most Mac users cannot launch would look like support and would not be.
# Add macOS here at the same time as signing and notarisation, not before.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to freeze'
        required: true
        default: artifice-ocr
        type: choice
        options:
          - artifice-ocr
          - artifice-draft
          - artifice-graph
          - artifice-hub
  push:
    tags:
      - 'v*'

# The build job only checks out, builds, and uploads a workflow artifact
# (upload-artifact needs no elevated token scope) — read-only is sufficient.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} — ${{ matrix.app }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # a Windows failure should not hide a Linux success
      matrix:
        os: [windows-latest, ubuntu-latest]
        # A tag push has no `inputs.app`, so it must build every app; a manual
        # dispatch builds exactly the one selected. `fromJSON` over a
        # conditional string is the standard per-trigger matrix idiom.
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch'
              && format('["{0}"]', inputs.app)
              || '["artifice-ocr","artifice-draft","artifice-graph","artifice-hub"]') }}

    steps:
      # v7 to match every other workflow. Dependabot's checkout/setup-uv bumps
      # (#29, #30) were raised before this file existed, so they did not cover
      # it — a new workflow added between a Dependabot PR being opened and
      # merged inherits the old pins silently, and only a later run notices.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the app and PyInstaller
        shell: bash
        # Per-app extras — avoids pulling in the ~5.8 GB ASR stack when
        # freezing ocr, and keeps each app's build focused. The mapping is
        # explicit rather than derived from the app name because the extra
        # names do not follow a strict naming convention.
        #
        # The Hub is NOT in the root `all` extra (it ships frozen, not via
        # PyPI), so it needs an explicit editable install after syncing the
        # workspace — `uv sync --extra all` pulls in shared-ui and the other
        # workspace packages the Hub depends on; the separate pip install is
        # the Hub package itself.
        run: |
          APP="${{ matrix.app }}"
          case "$APP" in
            artifice-draft) uv sync --extra draft-web ;;
            artifice-graph) uv sync --extra graph-web ;;
            artifice-hub)   uv sync --extra all && uv pip install -e apps/artifice-hub ;;
            *)               uv sync --extra ocr-web ;;
          esac

      - name: Freeze
        # Run from the repo root — the spec resolves paths relative to it, and
        # collect_data_files() needs the workspace packages importable.
        #
        # NOT `pyinstaller --onefile ...` ad hoc: the spec carries the data
        # collection for prompts, fonts, static, templates, configs and the
        # shared_ui assets. A bare invocation silently produces a binary that
        # starts and then 404s every asset.
        run: uv run --with pyinstaller pyinstaller --clean --noconfirm apps/${{ matrix.app }}/${{ matrix.app }}.spec

      - name: Smoke-test the built binary (Linux)
        if: runner.os == 'Linux'
        # Tests cannot see packaging bugs: they run against src/, while the bug
        # lives only in the artifact. So exercise the ARTIFACT over HTTP, and
        # assert on an asset that resolves via importlib.resources from the
        # shared package — the hardest case and the one this repo has shipped
        # broken four times.
        #
        # API path is per-app: /api/queue for ocr, /api/settings for draft,
        # /api/state for graph, /api/health for hub.
        # /shared/tokens.css is shared. The app-specific CSS path is NOT
        # uniform: ocr and draft both serve /static/css/app.css, but graph's
        # own base.html references /static/app.css directly (no css/
        # subdirectory) — graph's static/ tree also holds several other
        # top-level CSS files (entity-colors.css, pipeline.css), unlike ocr
        # and draft's single css/ subdirectory. Checking the wrong path here
        # doesn't test packaging, it just asserts a URL graph's own template
        # never generates.
        #
        # The Hub is a onefile bundle (not onedir), so:
        #  - The binary is at ./dist/artifice-hub, not ./dist/artifice-hub/artifice-hub
        #  - It needs --no-window to prevent PyWebView from opening a GUI
        #  - It needs longer startup time for self-extraction (sleep 15)
        #  - It has no shared masthead (no navByom); check for app-grid instead
        #  - pkill pattern uses dist/$APP to match both onedir and onefile paths
        run: |
          APP="${{ matrix.app }}"
          case "$APP" in
            artifice-draft) API="/api/settings"; APP_CSS="/static/css/app.css" ;;
            artifice-graph) API="/api/state"; APP_CSS="/static/app.css" ;;
            artifice-hub)   API="/api/health"; APP_CSS="/static/hub.css" ;;
            *)               API="/api/queue"; APP_CSS="/static/css/app.css" ;;
          esac
          # Hub is onefile — binary is a single file, not a directory
          if [ "$APP" = "artifice-hub" ]; then
            BINARY="./dist/$APP"
            EXTRA_ARGS="--no-window"
            WAIT=15
          else
            BINARY="./dist/$APP/$APP"
            EXTRA_ARGS=""
            WAIT=12
          fi
          setsid nohup "$BINARY" --port 18999 $EXTRA_ARGS > /tmp/exe.log 2>&1 < /dev/null &
          sleep $WAIT
          fail=0
          for path in / "$API" /shared/tokens.css "$APP_CSS"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18999$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          # Hub has its own editorial masthead with app-grid; shared-masthead
          # apps use navByom. The Hub is the only app without the shared
          # masthead — it loads hub.css and its own layout.
          if [ "$APP" = "artifice-hub" ]; then
            curl -s http://127.0.0.1:18999/ | grep -q app-grid \
              && echo "  hub dashboard rendered: yes" \
              || { echo "  hub dashboard MISSING"; fail=1; }
          else
            curl -s http://127.0.0.1:18999/ | grep -q navByom \
              && echo "  shared masthead rendered: yes" \
              || { echo "  shared masthead MISSING"; fail=1; }
          fi
          pkill -f "dist/$APP" || true
          echo "--- server log ---"; head -20 /tmp/exe.log
          exit $fail

      - name: Smoke-test the built binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # PowerShell notes, both learned the hard way in this repo:
        #  - never merge native stderr with 2>&1; in PS 5.1 it corrupts error
        #    handling and $LASTEXITCODE. pwsh here is 7.x, but the habit stands.
        #  - Start-Process, not `&`, so the server does not hold this step open
        #    — a backgrounded server holding the shell is exactly what killed
        #    the agent that built this locally.
        #
        # The Hub is a onefile bundle (not onedir), so:
        #  - The binary is at .\dist\artifice-hub.exe, not .\dist\artifice-hub\artifice-hub.exe
        #  - It needs --no-window to prevent PyWebView from opening a GUI
        #  - It needs longer startup time for self-extraction (Start-Sleep 25)
        #  - It has no shared masthead (no navByom); check for app-grid instead
        run: |
          $app = "${{ matrix.app }}"
          $apiPath = switch ($app) {
            "artifice-draft" { "/api/settings" }
            "artifice-graph" { "/api/state" }
            "artifice-hub" { "/api/health" }
            default { "/api/queue" }
          }
          # graph's base.html references /static/app.css directly (no css/
          # subdirectory, unlike ocr and draft) - see the Linux step's comment.
          # Hub serves hub.css from its own static tree.
          $appCss = switch ($app) {
            "artifice-graph" { "/static/app.css" }
            "artifice-hub" { "/static/hub.css" }
            default { "/static/css/app.css" }
          }
          # Hub is onefile — binary is a single .exe, not in a subdirectory
          if ($app -eq "artifice-hub") {
            $exe = ".\dist\$app.exe"
            $extraArgs = @("--no-window","--port","18999")
            $waitSec = 25
          } else {
            $exe = ".\dist\$app\$app.exe"
            $extraArgs = @("--port","18999")
            $waitSec = 20
          }
          if (-not (Test-Path $exe)) { Write-Error "no binary at $exe"; exit 1 }
          Write-Host "binary size: $((Get-Item $exe).Length) bytes"
          $p = Start-Process -FilePath $exe -ArgumentList $extraArgs -PassThru
          Start-Sleep -Seconds $waitSec
          $fail = 0
          foreach ($path in @("/",$apiPath,"/shared/tokens.css",$appCss)) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18999$path" -UseBasicParsing -TimeoutSec 15
              Write-Host "  $path -> $($r.StatusCode)"
              if ($r.StatusCode -ne 200) { $fail = 1 }
            } catch {
              Write-Host "  $path -> FAILED"
              $fail = 1
            }
          }
          # Hub has its own editorial masthead with app-grid; shared-masthead
          # apps use navByom. The Hub is the only app without the shared
          # masthead — it loads hub.css and its own layout.
          try {
            $body = (Invoke-WebRequest -Uri "http://127.0.0.1:18999/" -UseBasicParsing -TimeoutSec 15).Content
            if ($app -eq "artifice-hub") {
              if ($body -match "app-grid") { Write-Host "  hub dashboard rendered: yes" }
              else { Write-Host "  hub dashboard MISSING"; $fail = 1 }
            } else {
              if ($body -match "navByom") { Write-Host "  shared masthead rendered: yes" }
              else { Write-Host "  shared masthead MISSING"; $fail = 1 }
            }
          } catch { Write-Host "  index fetch FAILED"; $fail = 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          exit $fail

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os }}
          # Three paths cover both packaging modes without per-app conditionals:
          #   dist/$APP/       — onedir subdirectory (ocr, draft, graph)
          #   dist/$APP        — onefile bare binary (hub on Linux)
          #   dist/$APP.exe    — onefile .exe (hub on Windows)
          # upload-artifact includes whichever paths exist; if-no-files-found
          # only triggers when NONE of them match.
          path: |
            dist/${{ matrix.app }}/
            dist/${{ matrix.app }}
            dist/${{ matrix.app }}.exe
          if-no-files-found: error
          retention-days: 30

  # Attach the frozen bundles to the GitHub Release, on tags only.
  #
  # This is a separate job rather than extra steps on `build` for a reason:
  # the build job runs a PyInstaller freeze of third-party code and is
  # deliberately held to `contents: read` — it must not carry a write-capable
  # token while executing arbitrary build tooling. Only this job, which does
  # nothing but archive already-built artifacts and upload them, holds
  # `contents: write`, and only at the job level.
  attach-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # download-artifact needs this once job-level perms zero the defaults

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # A release asset must be a single file, and the onedir builds (ocr,
      # draft, graph) are directories — so archive each bundle into one tarball
      # (Linux) or zip (Windows). The Hub is onefile (a bare binary) but is
      # archived the same way for a uniform asset set and a name a user can
      # make sense of. `${{ github.ref_name }}` supplies the version.
      - name: Archive each bundle into a single release asset
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ github.ref_name }}"
          cd "$GITHUB_WORKSPACE"

          for app in artifice-ocr artifice-draft artifice-graph artifice-hub; do
            for os in Linux Windows; do
              (
                cd "dist/$app-$os"
                # upload-artifact may or may not have preserved the `dist/`
                # prefix; step inside it if so, so the archive opens to the
                # bundle (onedir folder or bare onefile binary), not a dist/ dir.
                [ -d dist ] && cd dist
                if [ "$os" = "Linux" ]; then
                  tar -czf "$GITHUB_WORKSPACE/$app-Linux-$VER.tar.gz" .
                else
                  zip -qr "$GITHUB_WORKSPACE/$app-Windows-$VER.zip" .
                fi
              )
            done
          done

          ls -l "$GITHUB_WORKSPACE"

      # `gh` is preinstalled on the runner; GH_TOKEN carries the job's
      # contents:write scope to the CLI.
      - name: Upload assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ github.ref_name }}"

          # Why wait for the release instead of creating it: the Release is
          # created by a DIFFERENT workflow — release.yml's `github-release`
          # job — which fires on the same tag. Two workflows, one trigger, no
          # ordering guarantee between them, so the release may not exist yet
          # when this job runs, and `gh release upload` against a missing
          # release fails. Poll for it here rather than create it: release.yml
          # owns creation and gates it on the version-consistency check first,
          # and creating it from two places would race. This loop is not a
          # pointless retry — it exists to de-race two workflows on one tag.
          for attempt in $(seq 1 30); do
            if gh release view "$VER" >/dev/null 2>&1; then
              echo "release $VER found on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::release $VER did not appear within 30 attempts" >&2
              exit 1
            fi
            sleep 10
          done

          gh release upload "$VER" \
            "artifice-ocr-Linux-$VER.tar.gz" \
            "artifice-ocr-Windows-$VER.zip" \
            "artifice-draft-Linux-$VER.tar.gz" \
            "artifice-draft-Windows-$VER.zip" \
            "artifice-graph-Linux-$VER.tar.gz" \
            "artifice-graph-Windows-$VER.zip" \
            "artifice-hub-Linux-$VER.tar.gz" \
            "artifice-hub-Windows-$VER.zip" \
            --clobber
