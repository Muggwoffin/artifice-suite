name: Build standalone executables

# WHY THIS WORKFLOW EXISTS
#
# PyInstaller cannot cross-compile. A Windows .exe must be built on Windows, a
# macOS binary on macOS. The maintainer's machine is Windows with WSL, and uv is
# deliberately NOT installed on the Windows side — so the only reproducible way
# to produce a Windows build is a Windows runner.
#
# The build is proven on Linux locally (249 MB onedir, serves HTTP 200 and
# resolves shared-ui assets through importlib.resources from inside the bundle).
# This workflow does the same on the platforms the maintainer ships to.
#
# macOS is deliberately ABSENT. A macOS binary cannot be opened by an ordinary
# user without notarisation — they would have to run
# `xattr -r -d com.apple.quarantine` by hand. Producing an unsigned .app that
# most Mac users cannot launch would look like support and would not be.
# Add macOS here at the same time as signing and notarisation, not before.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to freeze'
        required: true
        default: artifice-ocr
        type: choice
        options:
          - artifice-ocr
          - artifice-draft
          - artifice-graph
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.os }} — ${{ github.event.inputs.app || 'artifice-ocr' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # a Windows failure should not hide a Linux success
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      # v7 to match every other workflow. Dependabot's checkout/setup-uv bumps
      # (#29, #30) were raised before this file existed, so they did not cover
      # it — a new workflow added between a Dependabot PR being opened and
      # merged inherits the old pins silently, and only a later run notices.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the app and PyInstaller
        shell: bash
        # Per-app extras — avoids pulling in the ~5.8 GB ASR stack when
        # freezing ocr, and keeps each app's build focused. The mapping is
        # explicit rather than derived from the app name because the extra
        # names do not follow a strict naming convention.
        run: |
          APP="${{ github.event.inputs.app || 'artifice-ocr' }}"
          case "$APP" in
            artifice-draft) uv sync --extra draft-web ;;
            artifice-graph) uv sync --extra graph-web ;;
            *)               uv sync --extra ocr-web ;;
          esac

      - name: Freeze
        # Run from the repo root — the spec resolves paths relative to it, and
        # collect_data_files() needs the workspace packages importable.
        #
        # NOT `pyinstaller --onefile ...` ad hoc: the spec carries the data
        # collection for prompts, fonts, static, templates, configs and the
        # shared_ui assets. A bare invocation silently produces a binary that
        # starts and then 404s every asset.
        run: uv run --with pyinstaller pyinstaller --clean --noconfirm apps/${{ github.event.inputs.app || 'artifice-ocr' }}/${{ github.event.inputs.app || 'artifice-ocr' }}.spec

      - name: Smoke-test the built binary (Linux)
        if: runner.os == 'Linux'
        # Tests cannot see packaging bugs: they run against src/, while the bug
        # lives only in the artifact. So exercise the ARTIFACT over HTTP, and
        # assert on an asset that resolves via importlib.resources from the
        # shared package — the hardest case and the one this repo has shipped
        # broken four times.
        #
        # API path is per-app: /api/queue for ocr, /api/settings for draft,
        # /api/state for graph.
        # /shared/tokens.css is shared. The app-specific CSS path is NOT
        # uniform: ocr and draft both serve /static/css/app.css, but graph's
        # own base.html references /static/app.css directly (no css/
        # subdirectory) — graph's static/ tree also holds several other
        # top-level CSS files (entity-colors.css, pipeline.css), unlike ocr
        # and draft's single css/ subdirectory. Checking the wrong path here
        # doesn't test packaging, it just asserts a URL graph's own template
        # never generates.
        run: |
          APP="${{ github.event.inputs.app || 'artifice-ocr' }}"
          case "$APP" in
            artifice-draft) API="/api/settings"; APP_CSS="/static/css/app.css" ;;
            artifice-graph) API="/api/state"; APP_CSS="/static/app.css" ;;
            *)               API="/api/queue"; APP_CSS="/static/css/app.css" ;;
          esac
          setsid nohup "./dist/$APP/$APP" --port 18999 > /tmp/exe.log 2>&1 < /dev/null &
          sleep 12
          fail=0
          for path in / "$API" /shared/tokens.css "$APP_CSS"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18999$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          curl -s http://127.0.0.1:18999/ | grep -q navByom \
            && echo "  shared masthead rendered: yes" \
            || { echo "  shared masthead MISSING"; fail=1; }
          pkill -f "dist/$APP/$APP" || true
          echo "--- server log ---"; head -20 /tmp/exe.log
          exit $fail

      - name: Smoke-test the built binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # PowerShell notes, both learned the hard way in this repo:
        #  - never merge native stderr with 2>&1; in PS 5.1 it corrupts error
        #    handling and $LASTEXITCODE. pwsh here is 7.x, but the habit stands.
        #  - Start-Process, not `&`, so the server does not hold this step open
        #    — a backgrounded server holding the shell is exactly what killed
        #    the agent that built this locally.
        run: |
          $app = "${{ github.event.inputs.app || 'artifice-ocr' }}"
          $apiPath = switch ($app) {
            "artifice-draft" { "/api/settings" }
            "artifice-graph" { "/api/state" }
            default { "/api/queue" }
          }
          # graph's base.html references /static/app.css directly (no css/
          # subdirectory, unlike ocr and draft) - see the Linux step's comment.
          $appCss = switch ($app) {
            "artifice-graph" { "/static/app.css" }
            default { "/static/css/app.css" }
          }
          $exe = ".\dist\$app\$app.exe"
          if (-not (Test-Path $exe)) { Write-Error "no binary at $exe"; exit 1 }
          Write-Host "binary size: $((Get-Item $exe).Length) bytes"
          $p = Start-Process -FilePath $exe -ArgumentList "--port","18999" -PassThru
          Start-Sleep -Seconds 20
          $fail = 0
          foreach ($path in @("/",$apiPath,"/shared/tokens.css",$appCss)) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18999$path" -UseBasicParsing -TimeoutSec 15
              Write-Host "  $path -> $($r.StatusCode)"
              if ($r.StatusCode -ne 200) { $fail = 1 }
            } catch {
              Write-Host "  $path -> FAILED"
              $fail = 1
            }
          }
          try {
            $body = (Invoke-WebRequest -Uri "http://127.0.0.1:18999/" -UseBasicParsing -TimeoutSec 15).Content
            if ($body -match "navByom") { Write-Host "  shared masthead rendered: yes" }
            else { Write-Host "  shared masthead MISSING"; $fail = 1 }
          } catch { Write-Host "  index fetch FAILED"; $fail = 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          exit $fail

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app || 'artifice-ocr' }}-${{ runner.os }}
          path: dist/${{ github.event.inputs.app || 'artifice-ocr' }}/
          if-no-files-found: error
          retention-days: 30
