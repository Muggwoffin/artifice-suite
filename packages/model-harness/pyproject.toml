[project]
name = "model-harness"
version = "0.1.0"
description = "Shared BYOM connector and schema-validated call surface for Ollama, LM Studio, and generic OpenAI-compatible endpoints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_harness"]
