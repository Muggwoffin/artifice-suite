[project]
name = "shared-ui"
version = "0.1.0"
description = "Canonical design tokens, web fonts, and shared UI assets for the Artifice Suite"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_ui"]
include = ["shared_ui/assets/**"]
