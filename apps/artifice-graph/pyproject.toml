[project]
name = "artifice-graph"
version = "0.1.0"
description = "Modular local-first GraphRAG & Entity Extraction pipeline for historical OCR text"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "typer[all]>=0.12",
    "model-harness",
    "shared-ui",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jinja2>=3.1",
    "aiofiles>=23.0",
]

[project.scripts]
artifice-graph = "artifice_graph.cli:app"
artifice-graph-web = "artifice_graph.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifice_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
