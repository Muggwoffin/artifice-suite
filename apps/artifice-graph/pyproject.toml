[project]
name = "artifice-graph"
version = "0.3.0"
description = "Modular local-first GraphRAG & Entity Extraction pipeline for historical OCR text"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "pdfplumber>=0.10",
    "platformdirs>=4.0.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    # NOT typer[all]: that extra was removed upstream, and `uv lock` warns
    # "typer==0.27.1 does not have an extra named 'all'" — a warning that
    # reached every `pip install artifice-graph` at 0.1.0. Modern typer bundles
    # rich and shellingham in the base package, and `rich` is declared above
    # explicitly in any case. cli.py uses only typer.Typer / Option / Exit.
    "typer>=0.12",
    "artifice-model-harness>=0.2.0",
    "artifice-secure-io>=0.2.0",
    "artifice-shared-ui>=0.2.0",
]
authors = [
    {name = "Maurice J. Casey"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "knowledge graph",
    "entity extraction",
    "RAG",
    "graph database",
    "digital humanities",
]

[project.urls]
Homepage = "https://github.com/Muggwoffin/artifice-suite"
Repository = "https://github.com/Muggwoffin/artifice-suite"
Issues = "https://github.com/Muggwoffin/artifice-suite/issues"

[project.optional-dependencies]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    # Imported directly at web/server.py:30 (BaseHTTPMiddleware) — the
    # dependency audit fails on undeclared direct imports.
    "starlette>=0.37",
    "jinja2>=3.1",
    "aiofiles>=23.0",
    # Required by the File()/UploadFile handler at web/server.py:1175 — FastAPI
    # refuses to start without it ("Form data requires python-multipart").
    # It was never declared, so the container has never served a request; no
    # test caught it because no test starts a container.
    "python-multipart>=0.0.9",
]
window = [
    "pywebview>=5.0",
]

[project.scripts]
artifice-graph = "artifice_graph.cli:app"
artifice-graph-web = "artifice_graph.web.server:main"

[build-system]
# Deliberate: hatchling auto-includes files inside the package directory.
# graph is the only app with both a templates/ and a static/ tree; converting
# to setuptools risks silently dropping them from the wheel — a class of bug
# this project has shipped four times and no test can see.
# Both packages/model-harness and packages/shared-ui also use hatchling,
# so graph is not an outlier here.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifice_graph"]

# A hatchling sdist defaults to EVERY git-tracked file in the project directory.
# A setuptools one does not — it takes the packages, package-data and a short
# list of standard files, and ignores the rest of the working tree. That
# asymmetry was measured on 2026-08-06, not assumed: graph's 0.1.0 sdist carried
# Dockerfile, three Windows .bat launchers and scripts/README.md, while the
# setuptools apps (ocr, draft, transcribe) shipped none of their equivalents —
# `apps/artifice-transcribe/AGENTS.md` is git-tracked and still never reached an
# sdist.
#
# So this exclusion is needed HERE and is not needed there. Do not "harmonise"
# the four apps by copying it around; it would be inert in the setuptools three
# and reading it there would imply a risk that does not exist.
#
# tests/ is deliberately NOT excluded. Shipping tests in an sdist is normal and
# lets a downstream packager verify the build; the earlier suggestion to strip
# them was a tidiness impulse, not a defect.
[tool.hatch.build.targets.sdist]
exclude = [
    "*.bat",
    "*.pyw",
    "Dockerfile",
    "scripts/",
    "data/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pywebview>=5.0",
]
