<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ArtificeOCR{% endblock %}</title>
  <link rel="stylesheet" href="/shared/fonts.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/shared/tokens.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/shared/masthead.css?v={{ asset_v }}">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/shared/byom.css?v={{ asset_v }}">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>

{% include '_masthead.html' %}

<div class="app" id="main-content">
{% block content %}{% endblock %}
</div>

<script src="/static/js/app.js?v={{ asset_v }}"></script>
<script src="/static/js/toast.js?v={{ asset_v }}"></script>
<script src="/static/js/palette.js?v={{ asset_v }}"></script>
<script src="/static/js/onboarding.js?v={{ asset_v }}"></script>
<script src="/static/js/tropy.js?v={{ asset_v }}"></script>
<script src="/static/js/pdf_export.js?v={{ asset_v }}"></script>
<script src="/static/js/find_replace.js?v={{ asset_v }}"></script>
<script src="/static/js/preview_image.js?v={{ asset_v }}"></script>
<script src="/static/js/preview.js?v={{ asset_v }}"></script>
<script src="/static/js/history.js?v={{ asset_v }}"></script>
<script src="/static/js/analytics.js?v={{ asset_v }}"></script>
<script src="/static/js/ludwiglang.js?v={{ asset_v }}"></script>
<script src="/static/js/settings.js?v={{ asset_v }}"></script>
<script src="/shared/byom.js?v={{ asset_v }}"></script>
<script>
(function () {
  "use strict";
  var byom = window.ArtificeByom.create({
    appName: "ArtificeOCR",
    onConfigured: function () { byom.close(); }
  });
  fetch("/api/byom/state")
    .then(function (r) { return r.json(); })
    .then(function (state) {
      if (!state.configured) { byom.open(); }
    })
    ["catch"](function () { /* server not ready yet — fine */ });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
