[project]
name = "artifice-ocr"
version = "0.1.0"
description = "A pipeline for historical document OCR and translation."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "typer",
    "ollama",
    "openai",
    "python-dotenv",
    "pyyaml",
    "PyMuPDF",
    "reportlab",
    "huggingface_hub",
    "artifice-secure-io>=0.1.0",
    "artifice-shared-ui>=0.1.0",
    "artifice-model-harness>=0.1.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
artifice-ocr = "artifice_ocr.cli:app"
artifice-ocr-web = "artifice_ocr.web.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"artifice_ocr.web" = ["static/**", "templates/**/*.html", "fonts/**"]
"artifice_ocr.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
