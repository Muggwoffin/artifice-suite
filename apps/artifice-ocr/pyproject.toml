[project]
name = "artifice-ocr"
version = "0.1.0"
description = "A pipeline for historical document OCR and translation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "ollama",
    "openai",
    "python-dotenv",
    "pyyaml",
    "PyMuPDF",
    "tkinterdnd2",
    "reportlab",
    "huggingface_hub",
]

[project.optional-dependencies]
# The tkinter GUI (artifice-ocr-gui) needs none of these. Only the web
# frontend (artifice-ocr-web) does.
web = [
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
artifice-ocr = "artifice_ocr.cli:app"
artifice-ocr-gui = "artifice_ocr.gui:main"
artifice-ocr-web = "artifice_ocr.web.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"artifice_ocr.web" = ["static/**"]
