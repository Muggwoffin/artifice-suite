[project]
name = "artifice-draft"
version = "0.2.0"
description = "Local-first copy editing: sends .docx paragraphs to an LLM and returns tracked-change edits."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "python-docx>=0.8.11",
    "docx-revisions>=0.1.5",
    "requests>=2.31.0",
    "httpx>=0.27",
    "jinja2>=3.0",
    "lxml>=5.0",
    "artifice-model-harness>=0.2.0",
    "artifice-secure-io>=0.2.0",
    "artifice-shared-ui>=0.2.0",
]
authors = [
    {name = "Maurice J. Casey"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "copy editing",
    "tracked changes",
    "academic writing",
    "DOCX",
]

[project.urls]
Homepage = "https://github.com/Muggwoffin/artifice-suite"
Repository = "https://github.com/Muggwoffin/artifice-suite"
Issues = "https://github.com/Muggwoffin/artifice-suite/issues"

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pywebview>=4.4",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8.1",
]

[project.scripts]
artifice-draft = "artifice_draft.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"artifice_draft.web" = ["static/**", "templates/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
