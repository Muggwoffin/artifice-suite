[project]
name = "artifice-transcribe"
version = "0.3.0"
description = "Speech-to-Text & Diarization API using WhisperX + PyAnnote"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# fastapi, uvicorn and python-multipart are deliberately core dependencies here
# rather than sitting behind a [web] extra as they do in the other three apps.
# transcribe's only entry point IS its API (artifice_transcribe.main:app), so a
# web-less install would produce something that cannot start, and
# `uv sync --extra transcribe` would resolve to a non-runnable app.
#
# The ASR stack (whisperx, torch, torchaudio, pyannote.audio, transformers) is
# optional — the app starts, serves its UI, and runs uploads, the database,
# summarise and cleanup without it.  Transcription features are guarded at
# runtime by a typed AsrUnavailable error that tells the user what extra to
# install (``uv sync --extra asr``, or ``pip install artifice-transcribe[asr]``
# outside the workspace).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "platformdirs>=4.0.0",
    "fpdf2>=2.8.0",
    "openai>=1.0.0",
    "jinja2>=3.0",
    "artifice-model-harness>=0.2.0",
    "numpy>=1.26",
    "artifice-secure-io>=0.2.0",
    "artifice-shared-ui>=0.2.0",
    "artifice-output-layout>=0.1.0",
]
authors = [
    {name = "Maurice J. Casey"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "speech-to-text",
    "transcription",
    "diarization",
    "oral history",
    "Whisper",
]

[project.urls]
Homepage = "https://github.com/Muggwoffin/artifice-suite"
Repository = "https://github.com/Muggwoffin/artifice-suite"
Issues = "https://github.com/Muggwoffin/artifice-suite/issues"

[project.optional-dependencies]
# ``--extra asr`` installs WhisperX + PyAnnote for transcription and
# diarisation.  In this workspace ``[tool.uv.sources]`` redirects torch
# to the CPU-only PyTorch index (Linux/Windows); outside the workspace
# (PyPI) torch resolves from default PyPI.  The CPU-vs-CUDA distinction
# is workspace-only — there is no standardised per-extra index selection
# in PEP 621.
#
# ``--extra asr-cuda`` selects the CUDA build instead, via the cu128 index
# below.  It must NOT be written as ``artifice-transcribe[asr]``: the source
# mappings are keyed on the extra name, so inheriting ``asr`` also inherits
# its CPU pin, and ``uv sync --extra asr-cuda`` silently produced the same
# CPU wheels as ``--extra asr`` while documenting the opposite.  Verified
# with ``--dry-run``: against the old definition it reported "Would make no
# changes" when switching between the two extras.  The package list is
# therefore duplicated on purpose — the two extras differ only in which
# index their torch wheels come from.
asr = [
    "whisperx>=3.8.0",
    "torch>=2.8.0,<2.9.0",
    "torchaudio>=2.8.0,<2.9.0",
    "torchvision>=0.23.0,<0.24.0",
    "torchcodec>=0.11.0,<0.12.0",
    "pyannote.audio>=4.0",
    "transformers>=4.0",
]
asr-cuda = [
    "whisperx>=3.8.0",
    "torch>=2.8.0,<2.9.0",
    "torchaudio>=2.8.0,<2.9.0",
    "torchvision>=0.23.0,<0.24.0",
    "torchcodec>=0.11.0,<0.12.0",
    "pyannote.audio>=4.0",
    "transformers>=4.0",
]
window = [
    "pywebview>=5.0",
]

[project.scripts]
artifice-transcribe = "artifice_transcribe.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"artifice_transcribe.web" = ["static/**", "templates/**/*.html"]

[tool.uv]
# `asr` and `asr-cuda` install the same packages from different indexes, so
# they can never be active together. Without this declaration uv has to prove
# the lockfile resolvable for every combination of extras, hits asr+asr-cuda,
# and fails with "Requirements contain conflicting indexes for package torch".
# Declaring the conflict lets it lock each extra separately.
conflicts = [
    [
        { extra = "asr" },
        { extra = "asr-cuda" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# cu128 rather than an older CUDA line: Blackwell cards (RTX 50-series, compute
# capability sm_120) are not covered by the cu126 wheels, and torch silently
# falls back to CPU on an unsupported architecture rather than failing loudly.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# One entry per extra per package. uv picks the mapping whose extra is active,
# so `--extra asr` gets CPU wheels and `--extra asr-cuda` gets CUDA ones.
# Passing BOTH extras at once is ambiguous and uv will say so — pick one.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "asr", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "asr-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "asr", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "asr-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "asr", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "asr-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
# torchcodec is the exception: the cu128 index publishes it for Linux only
# (manylinux aarch64/x86_64), so a Windows CUDA install has to take it from the
# CPU index. It is an audio/video decoder, not a compute path — pairing a CPU
# torchcodec with CUDA torch costs nothing, and on Windows its native DLL
# fails to load anyway (WhisperX warns and falls back to another decoder).
torchcodec = [
    { index = "pytorch-cpu", extra = "asr", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "asr-cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "asr-cuda", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
