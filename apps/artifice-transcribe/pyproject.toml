[project]
name = "artifice-transcribe"
version = "0.1.0"
description = "Speech-to-Text & Diarization API using WhisperX + PyAnnote"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# fastapi, uvicorn and python-multipart are deliberately core dependencies here
# rather than sitting behind a [web] extra as they do in the other three apps.
# transcribe's only entry point IS its API (artifice_transcribe.main:app), so a
# web-less install would produce something that cannot start, and
# `uv sync --extra transcribe` would resolve to a non-runnable app.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "platformdirs>=4.0.0",
    "whisperx>=3.3.0",
    "torch",
    "torchaudio",
    "fpdf2>=2.8.0",
    "openai>=1.0.0",
    "jinja2>=3.0",
    "model-harness",
    "secure-io",
    "shared-ui",
]

[project.scripts]
artifice-transcribe = "artifice_transcribe.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"artifice_transcribe.web" = ["static/**", "templates/**/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
